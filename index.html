<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Firebase Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", "Yu Gothic", "Meiryo", sans-serif;
            background: linear-gradient(135deg, #4f7cff 0%, #263a66 100%);
            min-height: 100vh;
            padding: 24px;
            color: #1f2937;
        }

        .container {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 18px 50px rgba(31, 41, 55, 0.18);
            padding: 36px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .login-container {
            min-height: calc(100vh - 48px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-panel {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 18px 50px rgba(31, 41, 55, 0.18);
            padding: 36px;
            width: 100%;
            max-width: 560px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        p {
            line-height: 1.7;
        }

        button {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        .login-button {
            width: 100%;
            margin-top: 24px;
        }

        .logout-btn {
            background: #eef2f7;
            color: #1f2937;
            white-space: nowrap;
        }

        .logout-btn:hover {
            background: #dfe7f1;
        }

        .hidden {
            display: none !important;
        }

        .error-message {
            display: none;
            background: #fef3f2;
            color: #b42318;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 18px;
            line-height: 1.6;
        }

        .error-message.show {
            display: block;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 32px;
            padding-bottom: 18px;
            border-bottom: 1px solid #e5e7eb;
        }

        .app-title {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            color: #111827;
        }

        .simple-content {
            padding: 8px 0;
        }

        .simple-content h2 {
            margin: 0 0 16px;
            font-size: 22px;
            font-weight: 700;
            color: #111827;
        }

        .simple-content p {
            margin: 0;
            font-size: 18px;
            line-height: 1.8;
            color: #1f2937;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
        }

        @media (max-width: 520px) {
            body {
                padding: 16px;
            }

            .container,
            .login-panel {
                padding: 24px;
            }

            .app-header {
                align-items: stretch;
                flex-direction: column;
            }

            .logout-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="login-container" id="loginSection">
            <div class="login-panel">
                <div class="error-message" id="errorMessage"></div>

                <h1>My Contents</h1>
                <p>Googleアカウントでログインするとポートフォリオが表示されます。</p>
                <button class="login-button" id="loginBtn" type="button">Googleでログイン</button>
            </div>
        </section>

        <section class="container hidden" id="portfolioSection" aria-live="polite">
            <div class="error-message" id="appErrorMessage"></div>

            <header class="app-header">
                <h1 class="app-title">タイトル</h1>
                <button class="logout-btn" id="logoutBtn" type="button">ログアウト</button>
            </header>

            <span class="visually-hidden" id="userEmail"></span>

            <div class="simple-content" id="portfolioContent">
                <h2>目次</h2>
                <p>１はじめ</p>
            </div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB2CH410X3yk4YTJWFC2JyEWScXZn77Z3I",
            authDomain: "my-portfolio-d3560.firebaseapp.com",
            databaseURL: "https://my-portfolio-d3560-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "my-portfolio-d3560",
            storageBucket: "my-portfolio-d3560.firebasestorage.app",
            messagingSenderId: "293517847141",
            appId: "1:293517847141:web:bec173cf345b47cf91f48c"
        };

        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const database = firebase.database();
        const provider = new firebase.auth.GoogleAuthProvider();

        const loginSection = document.getElementById("loginSection");
        const portfolioSection = document.getElementById("portfolioSection");
        const userEmail = document.getElementById("userEmail");
        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const errorMessage = document.getElementById("errorMessage");
        const appErrorMessage = document.getElementById("appErrorMessage");

        loginBtn.addEventListener("click", async () => {
            clearError();
            loginBtn.disabled = true;

            try {
                await auth.signInWithPopup(provider);
            } catch (error) {
                showError(toJapaneseError(error));
                console.error(error);
            } finally {
                loginBtn.disabled = false;
            }
        });

        logoutBtn.addEventListener("click", async () => {
            clearError();
            await auth.signOut();
        });

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                showLoginUI();
                return;
            }

            await showPortfolioUI(user);

            await database.ref(`loginUsers/${user.uid}`).set({
                uid: user.uid,
                name: user.displayName || "",
                email: user.email || "",
                lastLoginAt: firebase.database.ServerValue.TIMESTAMP
            });
        });

        function showLoginUI() {
            loginSection.classList.remove("hidden");
            portfolioSection.classList.add("hidden");
        }

        async function showPortfolioUI(user) {
            userEmail.textContent = user.email || user.displayName || user.uid;
            loginSection.classList.add("hidden");
            portfolioSection.classList.remove("hidden");
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add("show");
            appErrorMessage.textContent = message;
            appErrorMessage.classList.add("show");
        }

        function clearError() {
            errorMessage.textContent = "";
            errorMessage.classList.remove("show");
            appErrorMessage.textContent = "";
            appErrorMessage.classList.remove("show");
        }

        function toJapaneseError(error) {
            const code = error?.code || "unknown";
            const messages = {
                "auth/unauthorized-domain": "このドメインがFirebase Authenticationの承認済みドメインに入っていません。Firebase ConsoleでAuthorized domainsを確認してください。",
                "auth/popup-blocked": "ブラウザがログイン用ポップアップをブロックしています。ポップアップを許可して再試行してください。",
                "auth/popup-closed-by-user": "ログイン画面が閉じられました。もう一度ログインしてください。",
                "auth/operation-not-allowed": "Firebase ConsoleのAuthenticationでGoogleログインが有効になっていません。",
                "auth/invalid-api-key": "Firebase設定のapiKeyが正しくありません。"
            };

            return messages[code] || `ログインできませんでした。エラーコード: ${code}`;
        }
    </script>
</body>
</html>
