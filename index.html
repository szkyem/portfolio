<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My portfolio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Yu Gothic","Meiryo",sans-serif;color:#1f2937;background:linear-gradient(135deg,#4f7cff 0%,#263a66 100%);min-height:100vh}
button,input,textarea{font-family:inherit}
button{border:0;border-radius:6px;padding:10px 14px;font-weight:700;cursor:pointer;background:#2563eb;color:#fff}
button:hover{background:#1d4ed8}
.hidden{display:none!important}
.login-container{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-panel{background:#fff;border-radius:10px;box-shadow:0 18px 50px rgba(31,41,55,.18);padding:36px;width:100%;max-width:520px;text-align:center}
.login-panel h1{margin-bottom:12px}
.login-panel p{line-height:1.7}
.login-button{width:100%;margin-top:24px}
.error-message{display:none;background:#fef3f2;color:#b42318;padding:12px;border-radius:6px;margin-bottom:18px}
.error-message.show{display:block}
.app{min-height:100vh;background:transparent}
.app-header{height:72px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.28);position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);z-index:10}
.app-title{font-size:24px;font-weight:800}
.logout-btn,.secondary-btn{background:#eef2f7;color:#1f2937}
.logout-btn:hover,.secondary-btn:hover{background:#dfe7f1}
.app-body{padding:28px;max-width:1280px;margin:0 auto}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.breadcrumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#eef2ff;font-size:14px}
.breadcrumb button{background:transparent;color:#fff;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{border:2px solid #e5e7eb;border-radius:8px;padding:18px;background:rgba(255,255,255,.95);cursor:pointer;min-height:110px}
.card:hover{box-shadow:0 8px 24px rgba(15,23,42,.16);transform:translateY(-1px)}
.card.cool-blue{border-color:#a9c7df}.card.cool-mint{border-color:#a9d6c3}.card.cool-lavender{border-color:#c7b9dc}.card.cool-slate{border-color:#b9c2cc}.card.cool-teal{border-color:#9fcfd1}
.card-title{font-size:18px;font-weight:800;margin-bottom:8px;word-break:break-word}
.card-meta{color:#6b7280;font-size:13px}
.card-actions{margin-top:18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.edit-btn{background:#e0f2fe;color:#075985;padding:7px 10px;font-size:13px}
.edit-btn:hover{background:#bae6fd}
.delete-btn{background:#fee2e2;color:#991b1b;padding:7px 10px;font-size:13px}
.delete-btn:hover{background:#fecaca}
.detail{border:1px solid #e5e7eb;border-radius:8px;padding:20px;background:rgba(255,255,255,.96)}
.item-detail-title{font-size:24px;font-weight:800;margin-bottom:20px}
.tabs{display:flex;border-bottom:1px solid #e5e7eb;margin-bottom:20px;overflow-x:auto}
.tab-btn{background:transparent;color:#6b7280;border-radius:0;padding:14px 18px;border-bottom:3px solid transparent;white-space:nowrap}
.tab-btn.active{color:#2563eb;border-bottom-color:#2563eb}
.phase{border:1px solid #dbeafe;background:#eff6ff;border-radius:8px;padding:16px;margin-bottom:14px}
.phase-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.phase-title{font-size:17px;font-weight:800;word-break:break-word}
.task{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:10px;margin-bottom:8px}
.task-text{flex:1;word-break:break-word}
.task-text.done{text-decoration:line-through;color:#9ca3af}
.progress-wrap{margin-top:14px;padding-top:12px;border-top:1px solid #bfdbfe}
.progress-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
.progress-bar{height:8px;border-radius:999px;background:#dbeafe;overflow:hidden}
.progress-fill{height:100%;background:#2563eb}
.input{width:100%;border:1px solid #d1d5db;border-radius:6px;padding:12px;font-size:15px;margin-bottom:12px;background:#fff}
textarea.input{min-height:110px;resize:vertical}
.file-input{display:block;width:100%;border:1px solid #d1d5db;border-radius:6px;padding:10px;margin-bottom:12px;background:#fff}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{color:#6b7280;padding:24px;text-align:center;border:1px dashed #d1d5db;border-radius:8px;background:#f9fafb}
.history{margin-top:20px;display:grid;gap:12px}
.history-item{border:1px solid #e5e7eb;border-radius:8px;padding:14px;background:#f9fafb}
.history-date{color:#6b7280;font-size:13px;margin-bottom:8px}
.history-text{white-space:pre-wrap;line-height:1.7;word-break:break-word}
.timeline{position:relative;margin-top:24px;padding-left:42px}
.timeline:before{content:"";position:absolute;left:13px;top:8px;bottom:8px;width:3px;background:#d8dee8;border-radius:999px}
.timeline-entry{position:relative;margin-bottom:12px}
.timeline-dot{position:absolute;left:-42px;top:16px;width:28px;height:28px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #cbd5e1}
.timeline-entry.progress .timeline-dot{background:#2f80ed}
.timeline-entry.stumble .timeline-dot{background:#f6d365}
.timeline-card{border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;background:#fff}
.timeline-summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.timeline-summary::-webkit-details-marker{display:none}
.timeline-entry.progress .timeline-summary{background:#eaf3ff;color:#174a7c}
.timeline-entry.stumble .timeline-summary{background:#fff7cf;color:#705c00}
.timeline-date{font-size:13px;font-weight:700;opacity:.75;margin-bottom:4px}
.timeline-title{font-size:15px;font-weight:800;word-break:break-word}
.timeline-arrow{font-size:18px;transition:.2s}
details[open] .timeline-arrow{transform:rotate(180deg)}
.timeline-body{padding:16px 18px;border-top:1px solid #e5e7eb}
.progress-btn{background:#2f80ed}
.progress-btn:hover{background:#1d6fd6}
.stumble-btn{background:#f6d365;color:#453b00}
.stumble-btn:hover{background:#eec84e}
.attachments,.links{display:grid;gap:10px;margin-top:12px}
.attachment,.link-card{border:1px solid #e5e7eb;border-radius:8px;background:#fff;padding:12px}
.attachment-name,.link-title{font-weight:800;margin-bottom:8px;word-break:break-word}
.attachment-preview{border:1px solid #e5e7eb;border-radius:6px;overflow:hidden;background:#f9fafb;max-height:420px}
.attachment-preview img,.attachment-preview video{display:block;max-width:100%;max-height:420px;margin:auto}
.attachment-preview iframe{width:100%;height:420px;border:0}
.attachment-preview pre{padding:12px;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto}
.attachment-actions{margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.attachment-actions a,.link-card a{color:#2563eb;text-decoration:none;font-weight:700}
.link-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.top-progress,.published-group{border:1px solid #e5e7eb;border-radius:8px;padding:20px;background:rgba(255,255,255,.96);margin-bottom:24px}
.top-progress h2,.published-group h2{font-size:18px;margin-bottom:14px}
.progress-table{display:grid;gap:0}
.progress-row{display:grid;grid-template-columns:120px 170px 90px 1fr 105px 90px;gap:12px;align-items:center;min-height:44px;border-bottom:1px solid #edf2f7;font-size:13px}
.progress-row.header{font-weight:800;color:#475569;border-bottom:1px solid #dbe3ef}
.progress-row:last-child{border-bottom:0}
.status-pill{display:inline-flex;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.status-pill.progress{background:#dcfce7;color:#166534}
.status-pill.stumble{background:#fef3c7;color:#92400e}
.home-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.route-card{border:2px solid #e5e7eb;border-radius:8px;padding:20px;background:rgba(255,255,255,.95);min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.route-card{cursor:pointer}
.route-card-title{font-size:18px;font-weight:800;margin-bottom:10px;word-break:break-word}
.route-card-text{font-size:13px;color:#475569;line-height:1.65;white-space:pre-wrap}
.route-card-meta{font-size:13px;font-weight:800;color:#2563eb;margin-top:12px}
.route-card-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}
.open-btn{background:#dcfce7;color:#166534;padding:7px 10px;font-size:13px}
.open-btn:hover{background:#bbf7d0}
.publication-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,180px));gap:14px;align-items:start}
.publication-card{border:1px solid #e5e7eb;border-radius:8px;padding:14px;background:#fff;width:100%;aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.publication-card:hover{box-shadow:0 8px 24px rgba(15,23,42,.12);transform:translateY(-1px)}
.publication-head{display:flex;gap:12px;align-items:flex-start}
.publication-icon{width:42px;height:42px;border-radius:0;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto}
.publication-title{font-size:16px;font-weight:800;margin-bottom:8px;word-break:break-word}
.publication-text{font-size:13px;color:#64748b;line-height:1.55;white-space:pre-wrap}
.publication-meta{font-size:13px;font-weight:800;color:#2563eb;margin-top:10px}
.publication-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}
.publication-edit-form{border:1px solid #dbe4f0;border-radius:8px;background:#fff;padding:16px;margin-bottom:18px}
.publication-edit-form h2{font-size:18px;margin-bottom:12px}
.complete-btn{background:#dcfce7;color:#166534;padding:7px 10px;font-size:13px}
.complete-btn:hover{background:#bbf7d0}
.publish-btn{background:#fef3c7;color:#92400e;padding:7px 10px;font-size:13px}
.publish-btn:hover{background:#fde68a}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.62);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:10px;width:min(100%,960px);max-height:90vh;overflow:auto;padding:18px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.modal-content img,.modal-content video{max-width:100%;display:block;margin:auto}
.modal-content iframe{width:100%;height:70vh;border:1px solid #e5e7eb}
.modal-content pre{white-space:pre-wrap;word-break:break-word;background:#f9fafb;padding:14px;border-radius:8px}
@media(max-width:760px){.home-cards{grid-template-columns:1fr}.progress-row{grid-template-columns:1fr;gap:4px;padding:10px 0}.progress-row.header{display:none}}
@media(max-width:640px){.app-header{height:auto;padding:18px;align-items:stretch;flex-direction:column}.app-body{padding:18px}.logout-btn{width:100%}.link-inputs{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<section class="login-container" id="loginSection">
<div class="login-panel">
<div class="error-message" id="errorMessage"></div>
<h1>My portfolio</h1>
<p>Googleアカウントでログインするとコンテンツが表示されます。</p>
<button class="login-button" id="loginBtn" type="button">Googleでログイン</button>
</div>
</section>

<section class="app hidden" id="portfolioSection" aria-live="polite">
<header class="app-header">
<h1 class="app-title">My portfolio</h1>
<button class="logout-btn" id="logoutBtn" type="button">ログアウト</button>
</header>
<div class="app-body">
<div class="error-message" id="appErrorMessage"></div>
<div class="toolbar">
<nav class="breadcrumb" id="breadcrumb"></nav>
<div id="mainActions"></div>
</div>
<div id="appContent"></div>
</div>
</section>
</main>

<div class="modal" id="previewModal">
<div class="modal-box">
<div class="modal-head">
<strong id="previewTitle"></strong>
<button class="secondary-btn" id="closePreviewBtn" type="button">閉じる</button>
</div>
<div class="modal-content" id="previewContent"></div>
</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import{getDatabase,ref,get,set,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyB2CH410X3yk4YTJWFC2JyEWScXZn77Z3I",
authDomain:"my-portfolio-d3560.firebaseapp.com",
databaseURL:"https://my-portfolio-d3560-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"my-portfolio-d3560",
storageBucket:"my-portfolio-d3560.firebasestorage.app",
messagingSenderId:"293517847141",
appId:"1:293517847141:web:bec173cf345b47cf91f48c"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const database=getDatabase(app);
const provider=new GoogleAuthProvider();

const loginSection=document.getElementById("loginSection");
const portfolioSection=document.getElementById("portfolioSection");
const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");
const errorMessage=document.getElementById("errorMessage");
const appErrorMessage=document.getElementById("appErrorMessage");
const breadcrumb=document.getElementById("breadcrumb");
const mainActions=document.getElementById("mainActions");
const appContent=document.getElementById("appContent");
const previewModal=document.getElementById("previewModal");
const previewTitle=document.getElementById("previewTitle");
const previewContent=document.getElementById("previewContent");

let currentUser=null;
let data={categories:[]};
let view={section:"home",categoryId:null,projectId:null,itemId:null,tab:"roadmap"};

const cardColorClasses=["cool-blue","cool-mint","cool-lavender","cool-slate","cool-teal"];

function randomCardColor(){
return cardColorClasses[Math.floor(Math.random()*cardColorClasses.length)];
}

loginBtn.addEventListener("click",async()=>{
clearError();
loginBtn.disabled=true;
try{
await signInWithPopup(auth,provider);
}catch(error){
showError(toJapaneseError(error));
console.error(error);
}finally{
loginBtn.disabled=false;
}
});

logoutBtn.addEventListener("click",async()=>{
clearError();
await signOut(auth);
});

onAuthStateChanged(auth,async(user)=>{
if(!user){
currentUser=null;
loginSection.classList.remove("hidden");
portfolioSection.classList.add("hidden");
return;
}

currentUser=user;
loginSection.classList.add("hidden");
portfolioSection.classList.remove("hidden");

await set(ref(database,`loginUsers/${user.uid}`),{
uid:user.uid,
name:user.displayName||"",
email:user.email||"",
lastLoginAt:serverTimestamp()
});

await loadData();
render();
});

async function loadData(){
const snapshot=await get(ref(database,`users/${currentUser.uid}/portfolioData`));
data=snapshot.exists()?snapshot.val():{categories:[]};

if(!Array.isArray(data.categories)){
data.categories=[];
}

ensurePortfolioSettings();
await ensureCardColors();
}

function ensurePortfolioSettings(){
data.homeCards||={};
data.homeCards.published||={
title:"① 公開・完了したもの",
text:"公開したページを大項目ごとに分けて表示。四角の中を触るとリンクが開く。編集からURLを登録する。",
meta:"公開リンク / 完了アーカイブ"
};
data.homeCards.development||={
title:"② 開発中",
text:"既存indexと同じ大項目→中項目→小項目の操作を保持。中身の基本機能は触らない。",
meta:"既存の階層管理"
};
data.publications||={};
}

function publicationKey(type,id){
return`${type}:${id}`;
}

function isCompleted(entry){
return Boolean(entry?.completed);
}

function completedEntries(){
const results=[];

(data.categories||[]).forEach((cat)=>{
if(isCompleted(cat)){
results.push({type:"category",id:cat.id,title:cat.name,description:"大項目",cat});
}

(cat.projects||[]).forEach((proj)=>{
if(isCompleted(proj)){
results.push({type:"project",id:proj.id,title:proj.name,description:`${cat.name} / 中項目`,cat,proj});
}
});
});

return results;
}

function publishedEntries(){
return completedEntries().filter((entry)=>data.publications[publicationKey(entry.type,entry.id)]?.published);
}

async function ensureCardColors(){
let changed=false;

data.categories.forEach((cat)=>{
if(!cat.cardColor){
cat.cardColor=randomCardColor();
changed=true;
}

(cat.projects||[]).forEach((proj)=>{
if(!proj.cardColor){
proj.cardColor=randomCardColor();
changed=true;
}
});
});

if(changed){
await saveData();
}
}

async function saveData(){
if(!currentUser)return;
await set(ref(database,`users/${currentUser.uid}/portfolioData`),data);
}

async function persistAndRender(){
await saveData();
render();
}

function uid(){
return`${Date.now()}_${Math.random().toString(16).slice(2)}`;
}

function escapeHtml(value){
return String(value??"").replace(/[&<>"']/g,(s)=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[s]));
}

function today(){
const d=new Date();
return`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
}

function getCategory(){
return data.categories.find((c)=>c.id===view.categoryId);
}

function getProject(){
return getCategory()?.projects?.find((p)=>p.id===view.projectId);
}

function getItem(){
return getProject()?.items?.find((i)=>i.id===view.itemId);
}

function ensureItemShape(item){
item.phases||=[];
item.issues||=[];
item.statuses||=[];

if(Array.isArray(item.stumbles)&&item.stumbles.length){
item.statuses.push(...item.stumbles.map((entry)=>({
id:entry.id||uid(),
date:entry.date||today(),
title:entry.title||"躓いた内容",
text:entry.text||entry.content||"",
type:"stumble",
attachments:entry.attachments||[],
links:entry.links||[]
})));
item.stumbles=[];
}
}

function render(){
renderBreadcrumb();

if(!view.categoryId){
if(view.section==="published")return renderPublished();
if(view.section==="development")return renderDevelopmentCategories();
return renderHome();
}
if(!view.projectId)return renderProjects();
if(!view.itemId)return renderItems();

return renderItemDetail();
}

function renderBreadcrumb(){
const cat=getCategory();
const proj=getProject();
const item=getItem();
const sectionLabel=view.section==="published"?"公開・完了したもの":view.section==="development"?"開発中":"";

breadcrumb.innerHTML=`
<button type="button" data-go="home">目次</button>
${sectionLabel&&!cat?`<span>/</span><span>${escapeHtml(sectionLabel)}</span>`:""}
${sectionLabel&&cat?`<span>/</span><button type="button" data-go="section">${escapeHtml(sectionLabel)}</button>`:""}
${cat?`<span>/</span><button type="button" data-go="category">${escapeHtml(cat.name)}</button>`:""}
${proj?`<span>/</span><button type="button" data-go="project">${escapeHtml(proj.name)}</button>`:""}
${item?`<span>/</span><span>${escapeHtml(item.name)}</span>`:""}
`;

breadcrumb.querySelector('[data-go="home"]')?.addEventListener("click",()=>{
view={section:"home",categoryId:null,projectId:null,itemId:null,tab:"roadmap"};
render();
});

breadcrumb.querySelector('[data-go="section"]')?.addEventListener("click",()=>{
view.categoryId=null;
view.projectId=null;
view.itemId=null;
render();
});

breadcrumb.querySelector('[data-go="category"]')?.addEventListener("click",()=>{
view.projectId=null;
view.itemId=null;
render();
});

breadcrumb.querySelector('[data-go="project"]')?.addEventListener("click",()=>{
view.itemId=null;
render();
});
}

function renderHome(){
mainActions.innerHTML=`<button type="button" id="addCategoryBtn">大項目を追加</button>`;

appContent.innerHTML=`
${progressLogHtml(4)}
<section class="home-cards">
${homeRouteCardHtml("published")}
${homeRouteCardHtml("development")}
</section>
`;

document.getElementById("addCategoryBtn").addEventListener("click",addCategory);
bindHomeRouteActions();
bindProgressEditButtons();
}

function homeRouteCardHtml(key){
const card=data.homeCards[key];

return`
<article class="route-card" data-route-card="${key}">
<div>
<div class="route-card-title">${escapeHtml(card.title)}</div>
<div class="route-card-text">${escapeHtml(card.text)}</div>
<div class="route-card-meta">${escapeHtml(card.meta)}</div>
</div>
<div class="route-card-actions">
<button class="edit-btn" type="button" data-edit-home-card="${key}">編集</button>
</div>
</article>
`;
}

function bindHomeRouteActions(){
appContent.querySelectorAll("[data-route-card]").forEach((card)=>{
card.addEventListener("click",()=>{
view={section:card.dataset.routeCard,categoryId:null,projectId:null,itemId:null,tab:"roadmap"};
render();
});
});

appContent.querySelectorAll("[data-edit-home-card]").forEach((btn)=>{
btn.addEventListener("click",async(event)=>{
event.stopPropagation();
const key=btn.dataset.editHomeCard;
const card=data.homeCards[key];
const title=prompt("タイトルを編集",card.title);
if(title===null)return;
const text=prompt("補足を編集",card.text);
if(text===null)return;
const meta=prompt("下部ラベルを編集",card.meta);
if(meta===null)return;

card.title=title.trim()||card.title;
card.text=text.trim()||card.text;
card.meta=meta.trim()||card.meta;
await persistAndRender();
});
});
}

function renderDevelopmentCategories(){

appContent.innerHTML=`

function collectStatusEntries(){
const entries=[];

(data.categories||[]).forEach((cat)=>{
(cat.projects||[]).forEach((proj)=>{
(proj.items||[]).forEach((item)=>{

(item.statuses||[]).forEach((status)=>{

});
});
});
});

return entries.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))||String(b.id||"").localeCompare(String(a.id||"")));
}

function phaseProgress(phase){
const tasks=phase.tasks||[];
const total=tasks.length;
const done=tasks.filter((task)=>task.done).length;
const percent=total?Math.round((done/total)*100):0;

return{total,done,percent};
}

function parseRoadmapText(text){
const lines=text
.split(/\r?\n/)
.map((line)=>line.trim())
.filter(Boolean);

const phases=[];
let currentPhase=null;

lines.forEach((line)=>{
const phaseMatch=line.match(/^(フェーズ|Phase|セクション|Section)\s*[:：]?\s*(.+)$/i);
const bulletMatch=line.match(/^[-・*]\s*(.+)$/);
const numberedMatch=line.match(/^\d+[.)、．]\s*(.+)$/);

if(phaseMatch){
currentPhase={
id:uid(),
title:phaseMatch[2].trim(),
tasks:[]
};
phases.push(currentPhase);
return;
}

if((bulletMatch||numberedMatch)&&currentPhase){
currentPhase.tasks.push({
id:uid(),
text:(bulletMatch?.[1]||numberedMatch?.[1]).trim(),
done:false
});
return;
}

if(!currentPhase){
currentPhase={
id:uid(),
title:line,
tasks:[]
};
phases.push(currentPhase);
}else{
currentPhase.tasks.push({
id:uid(),
text:line.replace(/^\d+[.)、．]\s*/,"").trim(),
done:false
});
}
});

return phases.filter((phase)=>phase.title||phase.tasks.length);
}

item.statuses||=[];

tabContent.innerHTML=`
<input class="input" id="statusTitleInput" type="text" placeholder="日付横に表示するタイトル">
<textarea class="input" id="statusTextInput" placeholder="現状または躓いた内容を入力"></textarea>
<input class="file-input" id="statusFileInput" type="file" multiple>
<div class="link-inputs">
<input class="input" id="linkTitleInput" type="text" placeholder="リンクタイトル">
<input class="input" id="linkUrlInput" type="url" placeholder="https://example.com">
</div>
<div class="row-actions">
<button class="progress-btn" type="button" id="addProgressBtn">進捗として追加</button>
<button class="stumble-btn" type="button" id="addStumbleBtn">躓きとして追加</button>
</div>

${item.statuses.length?`
<div class="timeline">
${item.statuses.map((entry,index)=>statusEntryHtml(entry,index)).join("")}
</div>
`:`<div class="empty" style="margin-top:20px;">現状の履歴がありません。</div>`}
`;

document.getElementById("addProgressBtn").addEventListener("click",()=>addStatusEntry(item,"progress"));
document.getElementById("addStumbleBtn").addEventListener("click",()=>addStatusEntry(item,"stumble"));

bindHistoryEditAndDelete(tabContent,item.statuses);
bindPreviewButtons(tabContent);
}

function statusEntryHtml(entry,index){
const type=entry.type==="stumble"?"stumble":"progress";

return`
<div class="timeline-entry ${type}">
<span class="timeline-dot"></span>
<details class="timeline-card">
<summary class="timeline-summary">
<div>
<div class="timeline-date">${escapeHtml(entry.date)}</div>
<div class="timeline-title" data-history-title="${index}">${escapeHtml(entry.title||"無題")}</div>
</div>
<span class="timeline-arrow">▼</span>
</summary>
<div class="timeline-body">
<div class="history-text" data-history-text="${index}">${escapeHtml(entry.text||"")}</div>
${attachmentHtml(entry.attachments)}
${linksHtml(entry.links)}
<div class="row-actions">
<button class="delete-btn" type="button" data-delete-history="${index}">削除</button>
</div>
</div>
</details>
</div>
`;
}

async function addStatusEntry(item,type){
const title=document.getElementById("statusTitleInput").value.trim();
const text=document.getElementById("statusTextInput").value.trim();
const files=Array.from(document.getElementById("statusFileInput").files||[]);
const link=buildLink();

if(!title&&!text&&!files.length&&!link)return;

const attachments=await Promise.all(files.map(readFileAsDataUrl));

item.statuses.unshift({
id:uid(),
date:today(),
title:title||(type==="progress"?"進捗":"躓いた内容"),
text,
type,
attachments,
links:link?[link]:[]
});

await persistAndRender();
}

function buildLink(){
const title=document.getElementById("linkTitleInput")?.value.trim()||"";
const url=document.getElementById("linkUrlInput")?.value.trim()||"";

if(!url)return null;

return{
id:uid(),
title:title||url,
url
};
}

function readFileAsDataUrl(file){
return new Promise((resolve,reject)=>{
const reader=new FileReader();

reader.onload=()=>{
resolve({
id:uid(),
name:file.name,
type:file.type||"application/octet-stream",
size:file.size,
data:reader.result
});
};

reader.onerror=reject;
reader.readAsDataURL(file);
});
}

function attachmentHtml(attachments){
if(!attachments?.length)return"";

return`
<div class="attachments">
${attachments.map((file)=>`
<div class="attachment">
<div class="attachment-name">${escapeHtml(file.name)}</div>
${previewSnippet(file)}
<div class="attachment-actions">
<button class="secondary-btn" type="button" data-preview-file="${file.id}">大きく表示</button>
<a href="${escapeHtml(file.data)}" download="${escapeHtml(file.name)}">ダウンロード</a>
</div>
</div>
`).join("")}
</div>
`;
}

function previewSnippet(file){
if(file.type.startsWith("image/")){
return`<div class="attachment-preview"><img src="${escapeHtml(file.data)}" alt="${escapeHtml(file.name)}"></div>`;
}

if(file.type.startsWith("video/")){
return`<div class="attachment-preview"><video src="${escapeHtml(file.data)}" controls></video></div>`;
}

if(file.type==="application/pdf"){
return`<div class="attachment-preview"><iframe src="${escapeHtml(file.data)}"></iframe></div>`;
}

if(file.type.startsWith("text/")){
return`<div class="attachment-preview"><pre>テキストファイルです。「大きく表示」で内容を確認できます。</pre></div>`;
}

return`<div class="attachment-preview"><pre>このファイル形式はプレビュー非対応です。必要に応じてダウンロードしてください。</pre></div>`;
}

function linksHtml(links){
if(!links?.length)return"";

return`
<div class="links">
${links.map((link)=>`
<div class="link-card">
<div class="link-title">${escapeHtml(link.title||link.url)}</div>
<a href="${escapeHtml(link.url)}" target="_blank" rel="noopener">リンクを開く</a>
</div>
`).join("")}
</div>
`;
}

function findAttachmentById(id){
const item=getItem();
const lists=[...(item?.issues||[]),...(item?.statuses||[])];

for(const entry of lists){
const found=(entry.attachments||[]).find((file)=>file.id===id);
if(found)return found;
}

return null;
}

function bindPreviewButtons(container){
container.querySelectorAll("[data-preview-file]").forEach((btn)=>{
btn.addEventListener("click",()=>{
const file=findAttachmentById(btn.dataset.previewFile);
if(file)openPreview(file);
});
});
}

async function openPreview(file){
previewTitle.textContent=file.name;

if(file.type.startsWith("image/")){
previewContent.innerHTML=`<img src="${escapeHtml(file.data)}" alt="${escapeHtml(file.name)}">`;
}else if(file.type.startsWith("video/")){
previewContent.innerHTML=`<video src="${escapeHtml(file.data)}" controls></video>`;
}else if(file.type==="application/pdf"){
previewContent.innerHTML=`<iframe src="${escapeHtml(file.data)}"></iframe>`;
}else if(file.type.startsWith("text/")){
const text=await fetch(file.data).then((r)=>r.text()).catch(()=>"表示できませんでした。");
previewContent.innerHTML=`<pre>${escapeHtml(text)}</pre>`;
}else{
previewContent.innerHTML=`<p>このファイル形式は画面表示に対応していません。ダウンロードしてください。</p>`;
}

previewModal.classList.add("show");
}

document.getElementById("closePreviewBtn").addEventListener("click",()=>{
previewModal.classList.remove("show");
});

previewModal.addEventListener("click",(event)=>{
if(event.target===previewModal){
previewModal.classList.remove("show");
}
});

function bindHistoryEditAndDelete(container,list){
container.querySelectorAll("[data-history-title]").forEach((el)=>{
el.addEventListener("dblclick",async(event)=>{
event.stopPropagation();

const index=Number(el.dataset.historyTitle);
const title=prompt("タイトルを編集",list[index].title||"");

if(title===null)return;

list[index].title=title.trim()||"無題";
await persistAndRender();
});
});

container.querySelectorAll("[data-history-text]").forEach((el)=>{
el.addEventListener("dblclick",async(event)=>{
event.stopPropagation();

const index=Number(el.dataset.historyText);
const text=prompt("コメントを編集",list[index].text||"");

if(text===null)return;

list[index].text=text.trim();
await persistAndRender();
});
});

container.querySelectorAll("[data-delete-history]").forEach((btn)=>{
btn.addEventListener("click",async(event)=>{
event.stopPropagation();

if(!confirm("履歴を削除しますか？"))return;

list.splice(Number(btn.dataset.deleteHistory),1);
await persistAndRender();
});
});
}

function showError(message){
errorMessage.textContent=message;
errorMessage.classList.add("show");
appErrorMessage.textContent=message;
appErrorMessage.classList.add("show");
}

function clearError(){
errorMessage.textContent="";
errorMessage.classList.remove("show");
appErrorMessage.textContent="";
appErrorMessage.classList.remove("show");
}

function toJapaneseError(error){
const code=error?.code||"unknown";

const messages={
"auth/unauthorized-domain":"このドメインがFirebase Authenticationの承認済みドメインに入っていません。Firebase ConsoleでAuthorized domainsを確認してください。",
"auth/popup-blocked":"ブラウザがログイン用ポップアップをブロックしています。ポップアップを許可して再試行してください。",
"auth/popup-closed-by-user":"ログイン画面が閉じられました。もう一度ログインしてください。",
"auth/operation-not-allowed":"Firebase ConsoleのAuthenticationでGoogleログインが有効になっていません。",
"auth/invalid-api-key":"Firebase設定のapiKeyが正しくありません。"
};

return messages[code]||`ログインできませんでした。エラーコード: ${code}`;
}
