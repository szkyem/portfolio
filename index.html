<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Firebase Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", "Yu Gothic", "Meiryo", sans-serif;
            background: linear-gradient(135deg, #4f7cff 0%, #263a66 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #1f2937;
        }

        .container {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 18px 50px rgba(31, 41, 55, 0.18);
            padding: 36px;
            width: 100%;
            max-width: 560px;
        }

        .login-section {
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        h2 {
            color: #1f2937;
            margin-bottom: 18px;
            border-bottom: 2px solid #4f7cff;
            padding-bottom: 10px;
        }

        p {
            line-height: 1.7;
        }

        button {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        .login-button {
            width: 100%;
            margin-top: 24px;
        }

        .logout-btn {
            background: #eef2f7;
            color: #1f2937;
            white-space: nowrap;
        }

        .logout-btn:hover {
            background: #dfe7f1;
        }

        .toc-section,
        .user-info,
        .content-area,
        .error-message {
            display: none;
        }

        .toc-section.active,
        .user-info.active,
        .content-area.active,
        .error-message.show {
            display: block;
        }

        .user-info {
            background: #f3f6fb;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .user-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .user-label {
            color: #667085;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .user-email {
            font-weight: 700;
            color: #1f2937;
            word-break: break-word;
        }

        .toc-list {
            list-style: none;
        }

        .toc-list li {
            padding: 12px;
            margin: 8px 0;
            background: #f8fafc;
            border-left: 4px solid #4f7cff;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .toc-list li:hover {
            background: #eef4ff;
            transform: translateX(4px);
        }

        .content-area {
            margin-top: 28px;
            padding: 18px;
            background: #f8fafc;
            border-radius: 8px;
        }

        .content-area h3 {
            margin-bottom: 10px;
        }

        .error-message {
            background: #fef3f2;
            color: #b42318;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 18px;
            line-height: 1.6;
        }

        @media (max-width: 520px) {
            .container {
                padding: 24px;
            }

            .user-row {
                align-items: stretch;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="error-message" id="errorMessage"></div>

        <section class="login-section" id="loginSection">
            <h1>My Contents</h1>
            <p>Googleアカウントでログインすると目次が表示されます。</p>
            <button class="login-button" id="loginBtn" type="button">Googleでログイン</button>
        </section>

        <section class="toc-section" id="tocSection" aria-live="polite">
            <div class="user-info" id="userInfo">
                <div class="user-row">
                    <div>
                        <p class="user-label">ログイン中</p>
                        <p class="user-email" id="userEmail"></p>
                    </div>
                    <button class="logout-btn" id="logoutBtn" type="button">ログアウト</button>
                </div>
            </div>

            <h2>目次</h2>
            <ul class="toc-list">
                <li data-chapter="chapter1">第1章: はじめに</li>
                <li data-chapter="chapter2">第2章: 基本概念</li>
                <li data-chapter="chapter3">第3章: 実装方法</li>
                <li data-chapter="chapter4">第4章: まとめ</li>
            </ul>

            <div class="content-area" id="contentArea">
                <div id="contentDisplay"></div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
        import {
            getAuth,
            GoogleAuthProvider,
            onAuthStateChanged,
            signInWithPopup,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        import {
            getDatabase,
            ref,
            serverTimestamp,
            set
        } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

        const firebaseConfig = {
  apiKey: "AIzaSyB2CH410X3yk4YTJWFC2JyEWScXZn77Z3I",
  authDomain: "my-portfolio-d3560.firebaseapp.com",
  databaseURL: "https://my-portfolio-d3560-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "my-portfolio-d3560",
  storageBucket: "my-portfolio-d3560.firebasestorage.app",
  messagingSenderId: "293517847141",
  appId: "1:293517847141:web:bec173cf345b47cf91f48c"
        };

        const contents = {
            chapter1: {
                title: "第1章: はじめに",
                text: "これはFirebaseログイン確認用のシンプルなサンプルです。"
            },
            chapter2: {
                title: "第2章: 基本概念",
                text: "コードはGitHubに保存し、ログイン情報などのデータはFirebaseに保存します。"
            },
            chapter3: {
                title: "第3章: 実装方法",
                text: "Firebase AuthenticationでGoogleログインし、Realtime Databaseへログイン記録を書き込みます。"
            },
            chapter4: {
                title: "第4章: まとめ",
                text: "この形を土台に、目次や本文データをFirebaseから読み込む構造へ広げられます。"
            }
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        const provider = new GoogleAuthProvider();

        const errorMessage = document.getElementById("errorMessage");
        const loginSection = document.getElementById("loginSection");
        const tocSection = document.getElementById("tocSection");
        const userInfo = document.getElementById("userInfo");
        const userEmail = document.getElementById("userEmail");
        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const contentArea = document.getElementById("contentArea");
        const contentDisplay = document.getElementById("contentDisplay");

        loginBtn.addEventListener("click", async () => {
            clearError();
            loginBtn.disabled = true;

            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                showError(toJapaneseError(error));
                console.error(error);
            } finally {
                loginBtn.disabled = false;
            }
        });

        logoutBtn.addEventListener("click", async () => {
            clearError();
            await signOut(auth);
        });

        document.querySelectorAll("[data-chapter]").forEach((item) => {
            item.addEventListener("click", () => showContent(item.dataset.chapter));
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                showLoginUI();
                return;
            }

            showLoggedInUI(user);
            await saveLoginRecord(user);
        });

        function showLoginUI() {
            loginSection.style.display = "block";
            tocSection.classList.remove("active");
            userInfo.classList.remove("active");
            contentArea.classList.remove("active");
        }

        function showLoggedInUI(user) {
            loginSection.style.display = "none";
            tocSection.classList.add("active");
            userInfo.classList.add("active");
            userEmail.textContent = user.email || user.displayName || user.uid;
        }

        function showContent(chapterId) {
            const content = contents[chapterId];
            if (!content) return;

            contentDisplay.innerHTML = `<h3>${content.title}</h3><p>${content.text}</p>`;
            contentArea.classList.add("active");
        }

        async function saveLoginRecord(user) {
            await set(ref(database, `loginUsers/${user.uid}`), {
                uid: user.uid,
                name: user.displayName || "",
                email: user.email || "",
                lastLoginAt: serverTimestamp()
            });
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add("show");
        }

        function clearError() {
            errorMessage.textContent = "";
            errorMessage.classList.remove("show");
        }

        function toJapaneseError(error) {
            const code = error?.code || "unknown";
            const messages = {
                "auth/unauthorized-domain": "このドメインがFirebase Authenticationの承認済みドメインに入っていません。Firebase ConsoleでAuthorized domainsを確認してください。",
                "auth/popup-blocked": "ブラウザがログイン用ポップアップをブロックしています。ポップアップを許可して再試行してください。",
                "auth/popup-closed-by-user": "ログイン画面が閉じられました。もう一度ログインしてください。",
                "auth/operation-not-allowed": "Firebase ConsoleのAuthenticationでGoogleログインが有効になっていません。",
                "auth/invalid-api-key": "Firebase設定のapiKeyが正しくありません。"
            };

            return messages[code] || `ログインできませんでした。エラーコード: ${code}`;
        }
    </script>
</body>
</html>
