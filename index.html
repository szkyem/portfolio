<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Segoe UI", "Yu Gothic", "Meiryo", sans-serif;
            background: #f4f6f9;
            color: #1f2937;
            min-height: 100vh;
        }

        button, input, textarea { font-family: inherit; }

        button {
            border: none;
            border-radius: 6px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 700;
            background: #2563eb;
            color: #fff;
        }

        button:hover { background: #1d4ed8; }
        .hidden { display: none !important; }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #4f7cff 0%, #263a66 100%);
        }

        .login-panel {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 18px 50px rgba(31, 41, 55, 0.18);
            padding: 36px;
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        .login-panel h1 { margin-bottom: 12px; }
        .login-panel p { line-height: 1.7; }
        .login-button { width: 100%; margin-top: 24px; }

        .error-message {
            display: none;
            background: #fef3f2;
            color: #b42318;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 18px;
        }

        .error-message.show { display: block; }

        .app {
            width: 100%;
            min-height: 100vh;
            background: #fff;
        }

        .app-header {
            height: 72px;
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e5e7eb;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .app-title {
            font-size: 24px;
            font-weight: 800;
        }

        .logout-btn {
            background: #eef2f7;
            color: #1f2937;
        }

        .logout-btn:hover { background: #dfe7f1; }

        .app-body {
            padding: 28px;
            max-width: 1280px;
            margin: 0 auto;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .breadcrumb {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            color: #6b7280;
            font-size: 14px;
        }

        .breadcrumb button {
            background: transparent;
            color: #2563eb;
            padding: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 16px;
        }

        .card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 18px;
            background: #fff;
            cursor: pointer;
            min-height: 110px;
        }

        .card:hover {
            border-color: #93c5fd;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.08);
        }

        .card-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .card-meta {
            color: #6b7280;
            font-size: 13px;
        }

        .card-actions {
            margin-top: 18px;
            display: flex;
            justify-content: flex-end;
        }

        .delete-btn {
            background: #fee2e2;
            color: #991b1b;
            padding: 7px 10px;
            font-size: 13px;
        }

        .delete-btn:hover { background: #fecaca; }

        .secondary-btn {
            background: #eef2f7;
            color: #1f2937;
        }

        .secondary-btn:hover { background: #dfe7f1; }

        .detail {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 20px;
            background: #fff;
        }

        .item-detail-title {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 20px;
            color: #111827;
        }

        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            color: #6b7280;
            border-radius: 0;
            padding: 14px 18px;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background: #f9fafb;
            color: #111827;
        }

        .tab-btn.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
        }

        .phase {
            border: 1px solid #dbeafe;
            background: #eff6ff;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .phase-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .phase-title {
            font-size: 17px;
            font-weight: 800;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .task-text {
            flex: 1;
            word-break: break-word;
        }

        .task-text.done {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .progress-wrap {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #bfdbfe;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 13px;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 8px;
            border-radius: 999px;
            background: #dbeafe;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #2563eb;
        }

        .input {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 12px;
            font-size: 15px;
            margin-bottom: 12px;
        }

        textarea.input {
            min-height: 110px;
            resize: vertical;
        }

        .file-input {
            display: block;
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 12px;
            background: #fff;
        }

        .history {
            margin-top: 20px;
            display: grid;
            gap: 12px;
        }

        .history-item {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 14px;
            background: #f9fafb;
        }

        .history-date {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .history-text {
            white-space: pre-wrap;
            line-height: 1.7;
            word-break: break-word;
        }

        .timeline {
            position: relative;
            margin-top: 24px;
            padding-left: 42px;
        }

        .timeline::before {
            content: "";
            position: absolute;
            left: 13px;
            top: 8px;
            bottom: 8px;
            width: 3px;
            background: #d8dee8;
            border-radius: 999px;
        }

        .timeline-entry {
            position: relative;
            margin-bottom: 12px;
        }

        .timeline-dot {
            position: absolute;
            left: -42px;
            top: 16px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 0 0 2px #cbd5e1;
        }

        .timeline-entry.progress .timeline-dot { background: #2f80ed; }
        .timeline-entry.stumble .timeline-dot { background: #f6d365; }

        .timeline-card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }

        .timeline-summary {
            list-style: none;
            cursor: pointer;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .timeline-summary::-webkit-details-marker { display: none; }

        .timeline-entry.progress .timeline-summary {
            background: #eaf3ff;
            color: #174a7c;
        }

        .timeline-entry.stumble .timeline-summary {
            background: #fff7cf;
            color: #705c00;
        }

        .timeline-date {
            font-size: 13px;
            font-weight: 700;
            opacity: 0.75;
            margin-bottom: 4px;
        }

        .timeline-title {
            font-size: 15px;
            font-weight: 800;
            word-break: break-word;
        }

        .timeline-arrow {
            font-size: 18px;
            transform: rotate(0deg);
            transition: transform 0.2s ease;
        }

        details[open] .timeline-arrow {
            transform: rotate(180deg);
        }

        .timeline-body {
            padding: 16px 18px;
            border-top: 1px solid #e5e7eb;
            background: #fff;
        }

        .timeline-type-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .progress-btn {
            background: #2f80ed;
        }

        .progress-btn:hover {
            background: #1d6fd6;
        }

        .stumble-btn {
            background: #f6d365;
            color: #453b00;
        }

        .stumble-btn:hover {
            background: #eec84e;
        }

        .attachments {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .attachment-link {
            display: inline-flex;
            align-items: center;
            max-width: 100%;
            padding: 7px 10px;
            border-radius: 6px;
            background: #eef2f7;
            color: #1f2937;
            text-decoration: none;
            font-size: 13px;
            word-break: break-word;
        }

        .attachment-link:hover {
            background: #dfe7f1;
        }

        .row-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .empty {
            color: #6b7280;
            padding: 24px;
            text-align: center;
            border: 1px dashed #d1d5db;
            border-radius: 8px;
            background: #f9fafb;
        }

        @media (max-width: 640px) {
            .app-header {
                height: auto;
                padding: 18px;
                align-items: stretch;
                flex-direction: column;
            }

            .app-body { padding: 18px; }
            .logout-btn { width: 100%; }
            .timeline { padding-left: 34px; }
            .timeline-dot { left: -34px; }
        }
    </style>
</head>
<body>
    <main>
        <section class="login-container" id="loginSection">
            <div class="login-panel">
                <div class="error-message" id="errorMessage"></div>
                <h1>My portfolio</h1>
                <p>Googleアカウントでログインするとコンテンツが表示されます。</p>
                <button class="login-button" id="loginBtn" type="button">Googleでログイン</button>
            </div>
        </section>

        <section class="app hidden" id="portfolioSection" aria-live="polite">
            <header class="app-header">
                <h1 class="app-title">My portfolio</h1>
                <button class="logout-btn" id="logoutBtn" type="button">ログアウト</button>
            </header>

            <div class="app-body">
                <div class="error-message" id="appErrorMessage"></div>

                <div class="toolbar">
                    <nav class="breadcrumb" id="breadcrumb"></nav>
                    <div id="mainActions"></div>
                </div>

                <div id="appContent"></div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
        import {
            getAuth,
            GoogleAuthProvider,
            signInWithPopup,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        import {
            getDatabase,
            ref,
            get,
            set,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2CH410X3yk4YTJWFC2JyEWScXZn77Z3I",
            authDomain: "my-portfolio-d3560.firebaseapp.com",
            databaseURL: "https://my-portfolio-d3560-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "my-portfolio-d3560",
            storageBucket: "my-portfolio-d3560.firebasestorage.app",
            messagingSenderId: "293517847141",
            appId: "1:293517847141:web:bec173cf345b47cf91f48c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        const provider = new GoogleAuthProvider();

        const loginSection = document.getElementById("loginSection");
        const portfolioSection = document.getElementById("portfolioSection");
        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const errorMessage = document.getElementById("errorMessage");
        const appErrorMessage = document.getElementById("appErrorMessage");
        const breadcrumb = document.getElementById("breadcrumb");
        const mainActions = document.getElementById("mainActions");
        const appContent = document.getElementById("appContent");

        let currentUser = null;
        let data = { categories: [] };
        let view = { categoryId: null, projectId: null, itemId: null, tab: "roadmap" };

        loginBtn.addEventListener("click", async () => {
            clearError();
            loginBtn.disabled = true;

            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                showError(toJapaneseError(error));
                console.error(error);
            } finally {
                loginBtn.disabled = false;
            }
        });

        logoutBtn.addEventListener("click", async () => {
            clearError();
            await signOut(auth);
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                currentUser = null;
                loginSection.classList.remove("hidden");
                portfolioSection.classList.add("hidden");
                return;
            }

            currentUser = user;
            loginSection.classList.add("hidden");
            portfolioSection.classList.remove("hidden");

            await set(ref(database, `loginUsers/${user.uid}`), {
                uid: user.uid,
                name: user.displayName || "",
                email: user.email || "",
                lastLoginAt: serverTimestamp()
            });

            await loadData();
            render();
        });

        async function loadData() {
            const snapshot = await get(ref(database, `users/${currentUser.uid}/portfolioData`));
            data = snapshot.exists() ? snapshot.val() : { categories: [] };
            if (!Array.isArray(data.categories)) data.categories = [];
        }

        async function saveData() {
            if (!currentUser) return;
            await set(ref(database, `users/${currentUser.uid}/portfolioData`), data);
        }

        async function persistAndRender() {
            await saveData();
            render();
        }

        function uid() {
            return `${Date.now()}_${Math.random().toString(16).slice(2)}`;
        }

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, (s) => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[s]));
        }

        function today() {
            const d = new Date();
            return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
        }

        function getCategory() {
            return data.categories.find((c) => c.id === view.categoryId);
        }

        function getProject() {
            return getCategory()?.projects?.find((p) => p.id === view.projectId);
        }

        function getItem() {
            return getProject()?.items?.find((i) => i.id === view.itemId);
        }

        function ensureItemShape(item) {
            item.phases ||= [];
            item.issues ||= [];
            item.statuses ||= [];

            if (Array.isArray(item.stumbles) && item.stumbles.length) {
                item.statuses.push(...item.stumbles.map((entry) => ({
                    id: entry.id || uid(),
                    date: entry.date || today(),
                    title: entry.title || "躓いた内容",
                    text: entry.text || entry.content || "",
                    type: "stumble",
                    attachments: entry.attachments || []
                })));
                item.stumbles = [];
            }
        }

        function render() {
            renderBreadcrumb();

            if (!view.categoryId) return renderCategories();
            if (!view.projectId) return renderProjects();
            if (!view.itemId) return renderItems();
            return renderItemDetail();
        }

        function renderBreadcrumb() {
            const cat = getCategory();
            const proj = getProject();
            const item = getItem();

            breadcrumb.innerHTML = `
                <button type="button" data-go="home">目次</button>
                ${cat ? `<span>/</span><button type="button" data-go="category">${escapeHtml(cat.name)}</button>` : ""}
                ${proj ? `<span>/</span><button type="button" data-go="project">${escapeHtml(proj.name)}</button>` : ""}
                ${item ? `<span>/</span><span>${escapeHtml(item.name)}</span>` : ""}
            `;

            breadcrumb.querySelector('[data-go="home"]')?.addEventListener("click", () => {
                view = { categoryId: null, projectId: null, itemId: null, tab: "roadmap" };
                render();
            });

            breadcrumb.querySelector('[data-go="category"]')?.addEventListener("click", () => {
                view.projectId = null;
                view.itemId = null;
                render();
            });

            breadcrumb.querySelector('[data-go="project"]')?.addEventListener("click", () => {
                view.itemId = null;
                render();
            });
        }

        function renderCategories() {
            mainActions.innerHTML = `<button type="button" id="addCategoryBtn">大項目を追加</button>`;
            appContent.innerHTML = data.categories.length
                ? `<div class="grid">${data.categories.map((cat) => cardHtml(cat, cat.projects?.length || 0, "中項目")).join("")}</div>`
                : `<div class="empty">大項目がありません。</div>`;

            document.getElementById("addCategoryBtn").addEventListener("click", addCategory);

            appContent.querySelectorAll(".card").forEach((card) => {
                card.addEventListener("click", () => {
                    view.categoryId = card.dataset.id;
                    render();
                });
            });

            bindCardEditing(data.categories, "大項目名");
        }

        function renderProjects() {
            const cat = getCategory();
            cat.projects ||= [];

            mainActions.innerHTML = `<button type="button" id="addProjectBtn">中項目を追加</button>`;
            appContent.innerHTML = cat.projects.length
                ? `<div class="grid">${cat.projects.map((proj) => cardHtml(proj, proj.items?.length || 0, "小項目")).join("")}</div>`
                : `<div class="empty">中項目がありません。</div>`;

            document.getElementById("addProjectBtn").addEventListener("click", addProject);

            appContent.querySelectorAll(".card").forEach((card) => {
                card.addEventListener("click", () => {
                    view.projectId = card.dataset.id;

                    const selectedProject = getProject();
                    const firstItem = selectedProject?.items?.[0];

                    if (firstItem) {
                        view.itemId = firstItem.id;
                        view.tab = "roadmap";
                    } else {
                        view.itemId = null;
                    }

                    render();
                });
            });

            bindCardEditing(cat.projects, "中項目名");
        }

        function renderItems() {
            const proj = getProject();
            proj.items ||= [];

            mainActions.innerHTML = `<button type="button" id="addItemBtn">小項目を追加</button>`;
            appContent.innerHTML = proj.items.length
                ? `<div class="grid">${proj.items.map((item) => cardHtml(item, 3, "項目セット")).join("")}</div>`
                : `<div class="empty">小項目がありません。</div>`;

            document.getElementById("addItemBtn").addEventListener("click", addItem);

            appContent.querySelectorAll(".card").forEach((card) => {
                card.addEventListener("click", () => {
                    view.itemId = card.dataset.id;
                    view.tab = "roadmap";
                    render();
                });
            });

            bindCardEditing(proj.items, "小項目名");
        }

        function cardHtml(entity, count, label) {
            return `
                <article class="card" data-id="${entity.id}">
                    <div class="card-title" data-title>${escapeHtml(entity.name)}</div>
                    <div class="card-meta">${count} ${label}</div>
                    <div class="card-actions">
                        <button class="delete-btn" type="button" data-delete="${entity.id}">削除</button>
                    </div>
                </article>
            `;
        }

        function bindCardEditing(list, label) {
            appContent.querySelectorAll("[data-title]").forEach((title) => {
                title.addEventListener("dblclick", async (event) => {
                    event.stopPropagation();
                    const id = title.closest(".card").dataset.id;
                    const target = list.find((entry) => entry.id === id);
                    const name = prompt(`${label}を編集`, target.name);
                    if (!name?.trim()) return;
                    target.name = name.trim();
                    await persistAndRender();
                });
            });

            appContent.querySelectorAll("[data-delete]").forEach((btn) => {
                btn.addEventListener("click", async (event) => {
                    event.stopPropagation();
                    if (!confirm("削除しますか？")) return;
                    const id = btn.dataset.delete;
                    const index = list.findIndex((entry) => entry.id === id);
                    if (index >= 0) list.splice(index, 1);
                    await persistAndRender();
                });
            });
        }

        async function addCategory() {
            const name = prompt("大項目名");
            if (!name?.trim()) return;
            data.categories.push({ id: uid(), name: name.trim(), projects: [] });
            await persistAndRender();
        }

        async function addProject() {
            const name = prompt("中項目名");
            if (!name?.trim()) return;
            const cat = getCategory();
            cat.projects ||= [];
            cat.projects.push({ id: uid(), name: name.trim(), items: [] });
            await persistAndRender();
        }

        async function addItem() {
            const name = prompt("小項目名");
            if (!name?.trim()) return;
            const proj = getProject();
            proj.items ||= [];
            proj.items.push({
                id: uid(),
                name: name.trim(),
                phases: [],
                issues: [],
                statuses: []
            });
            await persistAndRender();
        }

        function renderItemDetail() {
            const item = getItem();
            ensureItemShape(item);

            mainActions.innerHTML = "";
            appContent.innerHTML = `
                <section class="detail">
                    <h2 class="item-detail-title" id="itemDetailTitle" title="ダブルクリックで編集">${escapeHtml(item.name)}</h2>

                    <div class="tabs">
                        <button class="tab-btn ${view.tab === "roadmap" ? "active" : ""}" data-tab="roadmap">ロードマップ</button>
                        <button class="tab-btn ${view.tab === "issues" ? "active" : ""}" data-tab="issues">課題</button>
                        <button class="tab-btn ${view.tab === "status" ? "active" : ""}" data-tab="status">現状</button>
                    </div>

                    <div id="tabContent"></div>
                </section>
            `;

            document.getElementById("itemDetailTitle").addEventListener("dblclick", async () => {
                const name = prompt("小項目名を編集", item.name);
                if (!name?.trim()) return;
                item.name = name.trim();
                await persistAndRender();
            });

            appContent.querySelectorAll("[data-tab]").forEach((btn) => {
                btn.addEventListener("click", () => {
                    view.tab = btn.dataset.tab;
                    renderItemDetail();
                });
            });

            if (view.tab === "roadmap") renderRoadmap(item);
            if (view.tab === "issues") renderHistoryPanel(item, "issues", "課題コメント");
            if (view.tab === "status") renderStatusTimeline(item);
        }

        function phaseProgress(phase) {
            const tasks = phase.tasks || [];
            const total = tasks.length;
            const done = tasks.filter((task) => task.done).length;
            const percent = total ? Math.round((done / total) * 100) : 0;
            return { total, done, percent };
        }

        function renderRoadmap(item) {
            const tabContent = document.getElementById("tabContent");

            tabContent.innerHTML = `
                <div class="row-actions" style="margin-bottom:16px;">
                    <button type="button" id="addPhaseBtn">フェーズを追加</button>
                </div>

                ${item.phases.length ? item.phases.map((phase, phaseIndex) => {
                    const progress = phaseProgress(phase);

                    return `
                        <div class="phase" data-phase="${phaseIndex}">
                            <div class="phase-header">
                                <div class="phase-title" data-phase-title>${escapeHtml(phase.title)}</div>
                                <div class="row-actions" style="margin-top:0;">
                                    <button class="secondary-btn" type="button" data-add-task="${phaseIndex}">タスク追加</button>
                                    <button class="delete-btn" type="button" data-delete-phase="${phaseIndex}">削除</button>
                                </div>
                            </div>

                            ${(phase.tasks || []).map((task, taskIndex) => `
                                <div class="task" data-task="${taskIndex}">
                                    <input type="checkbox" ${task.done ? "checked" : ""} data-toggle-task="${phaseIndex}:${taskIndex}">
                                    <div class="task-text ${task.done ? "done" : ""}" data-task-text="${phaseIndex}:${taskIndex}">${escapeHtml(task.text)}</div>
                                    <button class="delete-btn" type="button" data-delete-task="${phaseIndex}:${taskIndex}">削除</button>
                                </div>
                            `).join("")}

                            <div class="progress-wrap">
                                <div class="progress-label">
                                    <span>進捗</span>
                                    <strong>${progress.percent}%（${progress.done}/${progress.total}）</strong>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width:${progress.percent}%;"></div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join("") : `<div class="empty">フェーズがありません。</div>`}
            `;

            document.getElementById("addPhaseBtn").addEventListener("click", async () => {
                const title = prompt("フェーズ名", `フェーズ${item.phases.length + 1}`);
                if (!title?.trim()) return;
                item.phases.push({ id: uid(), title: title.trim(), tasks: [] });
                await persistAndRender();
            });

            tabContent.querySelectorAll("[data-phase-title]").forEach((el) => {
                el.addEventListener("dblclick", async () => {
                    const index = Number(el.closest(".phase").dataset.phase);
                    const title = prompt("フェーズ名を編集", item.phases[index].title);
                    if (!title?.trim()) return;
                    item.phases[index].title = title.trim();
                    await persistAndRender();
                });
            });

            tabContent.querySelectorAll("[data-add-task]").forEach((btn) => {
                btn.addEventListener("click", async () => {
                    const phaseIndex = Number(btn.dataset.addTask);
                    const text = prompt("タスク名");
                    if (!text?.trim()) return;
                    item.phases[phaseIndex].tasks ||= [];
                    item.phases[phaseIndex].tasks.push({ id: uid(), text: text.trim(), done: false });
                    await persistAndRender();
                });
            });

            tabContent.querySelectorAll("[data-delete-phase]").forEach((btn) => {
                btn.addEventListener("click", async () => {
                    if (!confirm("フェーズを削除しますか？")) return;
                    item.phases.splice(Number(btn.dataset.deletePhase), 1);
                    await persistAndRender();
                });
            });

            tabContent.querySelectorAll("[data-toggle-task]").forEach((checkbox) => {
                checkbox.addEventListener("change", async () => {
                    const [phaseIndex, taskIndex] = checkbox.dataset.toggleTask.split(":").map(Number);
                    item.phases[phaseIndex].tasks[taskIndex].done = checkbox.checked;
                    await persistAndRender();
                });
            });

            tabContent.querySelectorAll("[data-task-text]").forEach((el) => {
                el.addEventListener("dblclick", async () => {
                    const [phaseIndex, taskIndex] = el.dataset.taskText.split(":").map(Number);
                    const task = item.phases[phaseIndex].tasks[taskIndex];
                    const text = prompt("タスクを編集", task.text);
                    if (!text?.trim()) return;
                    task.text = text.trim();
                    await persistAndRender();
                });
            });

            tabContent.querySelectorAll("[data-delete-task]").forEach((btn) => {
                btn.addEventListener("click", async () => {
                    if (!confirm("タスクを削除しますか？")) return;
                    const [phaseIndex, taskIndex] = btn.dataset.deleteTask.split(":").map(Number);
                    item.phases[phaseIndex].tasks.splice(taskIndex, 1);
                    await persistAndRender();
                });
            });
        }

        function readFileAsDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();

                reader.onload = () => {
                    resolve({
                        id: uid(),
                        name: file.name,
                        type: file.type || "application/octet-stream",
                        size: file.size,
                        data: reader.result
                    });
                };

                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function attachmentHtml(attachments) {
            if (!attachments?.length) return "";

            return `
                <div class="attachments">
                    ${attachments.map((file) => `
                        <a
                            class="attachment-link"
                            href="${escapeHtml(file.data)}"
                            download="${escapeHtml(file.name)}"
                            target="_blank"
                            rel="noopener"
                        >${escapeHtml(file.name)}</a>
                    `).join("")}
                </div>
            `;
        }

        function renderHistoryPanel(item, key, label) {
            const tabContent = document.getElementById("tabContent");
            item[key] ||= [];

            tabContent.innerHTML = `
                <input class="input" id="historyTitleInput" type="text" placeholder="タイトルを入力">
                <textarea class="input" id="commentInput" placeholder="${label}を入力"></textarea>
                <input class="file-input" id="fileInput" type="file" multiple>
                <button type="button" id="addHistoryBtn">履歴に追加</button>

                <div class="history">
                    ${item[key].length ? item[key].map((entry, index) => `
                        <article class="history-item" data-history="${index}">
                            <div class="history-date">${escapeHtml(entry.date)}</div>
                            <div class="history-text" data-history-title="${index}" style="font-weight:800; margin-bottom:8px;">${escapeHtml(entry.title || "無題")}</div>
                            <div class="history-text" data-history-text="${index}">${escapeHtml(entry.text)}</div>
                            ${attachmentHtml(entry.attachments)}
                            <div class="row-actions">
                                <button class="delete-btn" type="button" data-delete-history="${index}">削除</button>
                            </div>
                        </article>
                    `).join("") : `<div class="empty">履歴がありません。</div>`}
                </div>
            `;

            document.getElementById("addHistoryBtn").addEventListener("click", async () => {
                const titleInput = document.getElementById("historyTitleInput");
                const input = document.getElementById("commentInput");
                const fileInput = document.getElementById("fileInput");
                const title = titleInput.value.trim();
                const text = input.value.trim();
                const files = Array.from(fileInput.files || []);

                if (!title && !text && files.length === 0) return;

                const attachments = await Promise.all(files.map(readFileAsDataUrl));

                item[key].unshift({
                    id: uid(),
                    date: today(),
                    title: title || "無題",
                    text,
                    attachments
                });

                await persistAndRender();
            });

            bindHistoryEditAndDelete(tabContent, item[key]);
        }

        function renderStatusTimeline(item) {
            const tabContent = document.getElementById("tabContent");
            item.statuses ||= [];

            tabContent.innerHTML = `
                <input class="input" id="statusTitleInput" type="text" placeholder="日付横に表示するタイトル">
                <textarea class="input" id="statusTextInput" placeholder="現状または躓いた内容を入力"></textarea>
                <input class="file-input" id="statusFileInput" type="file" multiple>

                <div class="timeline-type-actions">
                    <button class="progress-btn" type="button" id="addProgressBtn">進捗として追加</button>
                    <button class="stumble-btn" type="button" id="addStumbleBtn">躓きとして追加</button>
                </div>

                ${item.statuses.length ? `
                    <div class="timeline">
                        ${item.statuses.map((entry, index) => statusEntryHtml(entry, index)).join("")}
                    </div>
                ` : `<div class="empty" style="margin-top:20px;">現状の履歴がありません。</div>`}
            `;

            document.getElementById("addProgressBtn").addEventListener("click", () => addStatusEntry(item, "progress"));
            document.getElementById("addStumbleBtn").addEventListener("click", () => addStatusEntry(item, "stumble"));

            bindHistoryEditAndDelete(tabContent, item.statuses);
        }

        function statusEntryHtml(entry, index) {
            const type = entry.type === "stumble" ? "stumble" : "progress";

            return `
                <div class="timeline-entry ${type}">
                    <span class="timeline-dot"></span>

                    <details class="timeline-card">
                        <summary class="timeline-summary">
                            <div>
                                <div class="timeline-date">${escapeHtml(entry.date)}</div>
                                <div class="timeline-title" data-history-title="${index}">${escapeHtml(entry.title || "無題")}</div>
                            </div>
                            <span class="timeline-arrow">▼</span>
                        </summary>

                        <div class="timeline-body">
                            <div class="history-text" data-history-text="${index}">${escapeHtml(entry.text || "")}</div>
                            ${attachmentHtml(entry.attachments)}
                            <div class="row-actions">
                                <button class="delete-btn" type="button" data-delete-history="${index}">削除</button>
                            </div>
                        </div>
                    </details>
                </div>
            `;
        }

        async function addStatusEntry(item, type) {
            const titleInput = document.getElementById("statusTitleInput");
            const textInput = document.getElementById("statusTextInput");
            const fileInput = document.getElementById("statusFileInput");

            const title = titleInput.value.trim();
            const text = textInput.value.trim();
            const files = Array.from(fileInput.files || []);

            if (!title && !text && files.length === 0) return;

            const attachments = await Promise.all(files.map(readFileAsDataUrl));

            item.statuses.unshift({
                id: uid(),
                date: today(),
                title: title || (type === "progress" ? "進捗" : "躓いた内容"),
                text,
                type,
                attachments
            });

            await persistAndRender();
        }

        function bindHistoryEditAndDelete(container, list) {
            container.querySelectorAll("[data-history-title]").forEach((el) => {
                el.addEventListener("dblclick", async (event) => {
                    event.stopPropagation();
                    const index = Number(el.dataset.historyTitle);
                    const title = prompt("タイトルを編集", list[index].title || "");
                    if (title === null) return;
                    list[index].title = title.trim() || "無題";
                    await persistAndRender();
                });
            });

            container.querySelectorAll("[data-history-text]").forEach((el) => {
                el.addEventListener("dblclick", async (event) => {
                    event.stopPropagation();
                    const index = Number(el.dataset.historyText);
                    const text = prompt("コメントを編集", list[index].text || "");
                    if (text === null) return;
                    list[index].text = text.trim();
                    await persistAndRender();
                });
            });

            container.querySelectorAll("[data-delete-history]").forEach((btn) => {
                btn.addEventListener("click", async (event) => {
                    event.stopPropagation();
                    if (!confirm("履歴を削除しますか？")) return;
                    list.splice(Number(btn.dataset.deleteHistory), 1);
                    await persistAndRender();
                });
            });
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add("show");
            appErrorMessage.textContent = message;
            appErrorMessage.classList.add("show");
        }

        function clearError() {
            errorMessage.textContent = "";
            errorMessage.classList.remove("show");
            appErrorMessage.textContent = "";
            appErrorMessage.classList.remove("show");
        }

        function toJapaneseError(error) {
            const code = error?.code || "unknown";
            const messages = {
                "auth/unauthorized-domain": "このドメインがFirebase Authenticationの承認済みドメインに入っていません。Firebase ConsoleでAuthorized domainsを確認してください。",
                "auth/popup-blocked": "ブラウザがログイン用ポップアップをブロックしています。ポップアップを許可して再試行してください。",
                "auth/popup-closed-by-user": "ログイン画面が閉じられました。もう一度ログインしてください。",
                "auth/operation-not-allowed": "Firebase ConsoleのAuthenticationでGoogleログインが有効になっていません。",
                "auth/invalid-api-key": "Firebase設定のapiKeyが正しくありません。"
            };

            return messages[code] || `ログインできませんでした。エラーコード: ${code}`;
        }
    </script>
</body>
</html>
