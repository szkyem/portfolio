<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f8f6; color: #000; }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem 1.5rem; }
        header { margin-bottom: 3rem; padding-bottom: 1.5rem; border-bottom: 1px solid #d0d0d0; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
        h1 { font-size: 32px; font-weight: 600; margin-bottom: 0.5rem; }
        .subtitle { font-size: 14px; color: #666; }
        .auth-box { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
        .auth-btn { background: #1976D2; color: white; border: none; padding: 0.75rem 1rem; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 600; }
        .auth-btn.logout { background: #666; }
        .auth-info { font-size: 12px; color: #555; }
        .role-badge { display: inline-block; padding: 0.3rem 0.6rem; border-radius: 999px; font-size: 11px; font-weight: 600; }
        .role-admin { background: #E3F2FD; color: #1565C0; }
        .role-member { background: #E8F5E9; color: #2E7D32; }
        .login-screen { max-width: 560px; margin: 4rem auto; background: white; border: 1px solid #d0d0d0; border-radius: 12px; padding: 2rem; text-align: center; }
        .login-screen h2 { margin-bottom: 1rem; }
        .login-screen p { color: #666; margin-bottom: 1.5rem; line-height: 1.7; }
        .hidden { display: none !important; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="config.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>📚 My Portfolio</h1>
                <p class="subtitle">プロジェクト進捗管理システム</p>
            </div>
            <div class="auth-box">
                <div id="authInfo" class="auth-info">未ログイン</div>
                <button id="loginBtn" class="auth-btn" onclick="loginWithGoogle()">Googleでログイン</button>
                <button id="logoutBtn" class="auth-btn logout hidden" onclick="logout()">ログアウト</button>
            </div>
        </header>

        <div id="loginScreen" class="login-screen">
            <h2>ログインが必要です</h2>
            <p>
                このポートフォリオは、許可されたメンバーのみ閲覧できます。<br>
                Googleアカウントでログインしてください。
            </p>
            <button class="auth-btn" onclick="loginWithGoogle()">Googleでログイン</button>
        </div>

        <div id="appScreen" class="hidden">
            <p>ログイン成功！</p>
        </div>
    </div>

    <script>
        // Firebase が config.js で初期化されたか確認
        if (typeof window.FIREBASE_CONFIG === 'undefined') {
            console.error('❌ config.js が見つかりません');
            alert('設定ファイルが見つかりません');
        } else {
            console.log('✅ config.js が読み込まれました');
            
            // Firebase を初期化
            firebase.initializeApp(window.FIREBASE_CONFIG);
            console.log('✅ Firebase が初期化されました');
            
            const auth = firebase.auth();
            const provider = new firebase.auth.GoogleAuthProvider();

            // Google ログイン関数
            function loginWithGoogle() {
                console.log('Google ログイン開始...');
                auth.signInWithRedirect(provider).catch(error => {
                    console.error('ログインエラー:', error);
                    alert('ログインに失敗しました: ' + error.message);
                });
            }

            // ログアウト関数
            function logout() {
                auth.signOut().catch(error => {
                    console.error('ログアウトエラー:', error);
                });
            }

            // ログイン状態の監視
            auth.onAuthStateChanged(user => {
                if (user) {
                    console.log('✅ ログイン成功:', user.email);
                    document.getElementById('authInfo').textContent = user.email;
                    document.getElementById('loginBtn').classList.add('hidden');
                    document.getElementById('logoutBtn').classList.remove('hidden');
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('appScreen').classList.remove('hidden');
                } else {
                    console.log('ログアウト状態');
                    document.getElementById('authInfo').textContent = '未ログイン';
                    document.getElementById('loginBtn').classList.remove('hidden');
                    document.getElementById('logoutBtn').classList.add('hidden');
                    document.getElementById('loginScreen').classList.remove('hidden');
                    document.getElementById('appScreen').classList.add('hidden');
                }
            });

            // グローバルスコープに関数を公開（ボタンから呼び出すため）
            window.loginWithGoogle = loginWithGoogle;
            window.logout = logout;
        }
    </script>
</body>
</html>
